<div #background id="background">
    <div class="icon" [attr.state]="state">
        <img #iconimg id="iconimg" src="assets/background_images/one.png" style="height: 250px; max-height: 25dvh" alt="">
        <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 0}" src="assets/section_icons/one.png" 
        style="transform: translate(-62%, 60%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/two.png" style="width: 170px; max-width: 17dvh" alt="">
      <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 1}" src="assets/section_icons/five.png" 
      style="transform: translate(-117%, -89%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/three.png" style="height: 110px; max-height: 11dvh" alt="">
      <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 2}" src="assets/section_icons/eight.png" 
      style="transform: translate(-49%, -47%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/four.png" style="height: 130px; max-height: 13dvh" alt="">
      <img #section class="section" [ngClass]="{'show brighten': navigation.current_slide >= 3}" src="assets/section_icons/orbit.png" 
      style="transform: translate(5%, -94%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/five.png" style="height: 220px; max-height: 22dvh" alt="">
      <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 4}" src="assets/section_icons/four.png" 
      style="transform: translate(-33%, 57%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/six.png" style="height: 130px; max-height: 13dvh" alt="">
      <img #section class="section" [ngClass]="{'show brighten2': navigation.current_slide >= 5}" src="assets/section_icons/matching.png" 
      style="transform: translate(-31%, -97%)" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/seven.png" style="height: 100px; max-height: 10dvh" alt="">
      <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 6}" src="assets/section_icons/six.png" 
      style="" alt="">
    </div>
    <div class="icon" [attr.state]="state">
      <img #iconimg id="iconimg" src="assets/background_images/eight.png" style="height: 120px; max-height: 12dvh" alt="">
      <img #section class="section" [ngClass]="{'show': navigation.current_slide >= 7}" src="assets/section_icons/seven.png" 
      style="" alt="">
    </div>

    <connection #conn0></connection>
    <connection #conn1></connection>
    <connection #conn2></connection>
    <connection #conn3></connection>
    <connection #conn4></connection>
    <connection #conn5></connection>
    <connection #conn6></connection>

</div>
